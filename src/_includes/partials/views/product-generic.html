{% raw %}
<sc-if value="{{ isGenericProduct }}">
<div style="max-width:1220px;margin:0 auto;padding:36px 24px 90px;">

  <button onClick="{{ goCatalog }}" style="background:none;border:none;cursor:pointer;color:#7A847F;font-size:14px;font-weight:600;padding:8px 0;margin-bottom:18px;" style-hover="color:#2EB6BE;">← Назад в каталог</button>

  <div class="rs-grid-2-prod">

    <div style="position:sticky;top:96px;background:#fff;border:1px solid #E8ECEC;border-radius:20px;overflow:hidden;">
      <sc-if value="{{ selHasImg }}">
        <img src="{{ selImg }}" alt="" style="width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:#fff;" />
      </sc-if>
      <sc-if value="{{ selNoImg }}">
        <div style="aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#EEF3F3,#EEF3F3 12px,#F7FAFA 12px,#F7FAFA 24px);display:flex;align-items:center;justify-content:center;">
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#9AA3A2;letter-spacing:0.06em;">фото · скоро</span>
        </div>
      </sc-if>
    </div>

    <div>
      <p style="font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#2EB6BE;margin:0 0 12px;">{{ selTagline }}</p>
      <h1 style="font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-0.025em;margin:0 0 18px;line-height:1.05;">{{ selName }}</h1>
      <p style="font-size:18px;line-height:1.6;color:#54605D;margin:0 0 28px;">{{ selDesc }}</p>
      <h3 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:#1D1D1B;margin:0 0 14px;">Характеристики</h3>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:32px;">
        <sc-for list="{{ selFeatures }}" as="f" hint-placeholder-count="4">
          <div style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:#F6F9F9;border-radius:11px;">
            <span style="width:8px;height:8px;border-radius:50%;background:#2EB6BE;margin-top:7px;flex:none;"></span>
            <span style="font-size:15.5px;color:#2A302E;font-weight:500;">{{ f }}</span>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <button onClick="{{ goContacts }}" style="padding:15px 30px;background:#2EB6BE;color:#fff;border:none;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer;" style-hover="background:#239aa1;">Запросить КП</button>
        <button onClick="{{ goCatalog }}"  style="padding:15px 30px;background:#fff;color:#1D1D1B;border:1.5px solid #D8DEDE;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer;" style-hover="border-color:#2EB6BE;color:#2EB6BE;">В каталог</button>
      </div>
    </div>

  </div>
</div>
</sc-if>
{% endraw %}
